# MySQL. Used by Docker Compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/retail_stock?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parola_root}
spring.h2.console.enabled=false
