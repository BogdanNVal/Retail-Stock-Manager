# Hosted demo (Render, Cloud Run, …). Requires a real database — not H2.
# Prefer SPRING_DATASOURCE_URL (jdbc:postgresql://…). DATABASE_URL
# (postgres:// or postgresql:// from Neon/Render) is converted at startup.
# Do not set an empty username here — that overrides user:pass inside DATABASE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Stay inside a 512 MB free-tier JVM.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
# Neon free can take >10s to wake; -1 keeps retrying instead of crashing the JVM.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jmx.enabled=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Cap concurrent requests so the tiny pool is not exhausted under OSIV.
server.tomcat.threads.max=20
server.tomcat.accept-count=20
# Fail clearly instead of hanging when Neon is unreachable.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
