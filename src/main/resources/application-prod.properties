# Hosted demo (Render, Cloud Run, …). Requires a real database — not H2.
# Prefer SPRING_DATASOURCE_URL (jdbc:postgresql://…). DATABASE_URL
# (postgres:// or postgresql:// from Neon/Render) is converted at startup.
# Do not set an empty username here — that overrides user:pass inside DATABASE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Stay inside a 512 MB free-tier JVM.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
