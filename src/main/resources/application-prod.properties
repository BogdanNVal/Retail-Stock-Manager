# Hosted demo. Needs a real Postgres URL, not H2.
# Prefer SPRING_DATASOURCE_URL. DATABASE_URL (postgres:// from Neon) is converted at startup.
# Don't set an empty username here — it overrides user:pass inside DATABASE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Stay inside a 512 MB JVM.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
# Neon free can take >10s to wake. -1 = keep retrying instead of crashing.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jmx.enabled=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Tiny pool + OSIV: cap Tomcat threads so we don't run out of connections.
server.tomcat.threads.max=20
server.tomcat.accept-count=20
# Hibernate creates the schema. Don't also run classpath SQL.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
