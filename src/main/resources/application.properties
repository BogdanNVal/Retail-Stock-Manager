# Shared settings for all profiles. Activate with SPRING_PROFILES_ACTIVE
# (default: dev). Docker Compose sets profile "docker".
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local / Docker Compose: bind PORT (default 8080) on all interfaces.
# On Render/Cloud Run the Docker entrypoint binds PORT and sets SERVER_PORT
# / SERVER_ADDRESS for Tomcat on loopback.
server.port=${PORT:8080}
server.address=0.0.0.0
# Honor X-Forwarded-* so HTTPS login cookies work behind a reverse proxy.
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true

# Override via APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD environment variables
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
