# --- MySQL (persistent, ruleaza prin Docker: docker compose up) ---
# Valorile de mai jos pot fi suprascrise din variabile de mediu
# (vezi environment: in docker-compose.yml), asa ca merg si local, si in container.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/retail_stock?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parola_root}

# --- Alternativa: H2 in-memory, utila pentru testare rapida FARA Docker/MySQL. ---
# Pentru a folosi H2, comenteaza cele 4 linii de mai sus si decomenteaza urmatoarele:
# spring.datasource.url=jdbc:h2:mem:retaildb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Configurare view resolver pentru JSP ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

server.port=8080
