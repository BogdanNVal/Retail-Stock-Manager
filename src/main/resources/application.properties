# Shared settings for all profiles. Activate with SPRING_PROFILES_ACTIVE
# (default: dev). Docker Compose sets profile "docker".
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

server.port=8080

# Override via APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD environment variables
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
