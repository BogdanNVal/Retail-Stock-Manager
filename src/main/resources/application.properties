# Shared settings for all profiles. Activate with SPRING_PROFILES_ACTIVE
# (default: dev). Docker Compose sets profile "docker".
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Render and Cloud Run inject PORT. Bind all interfaces so the proxy can reach Tomcat
# (Render scans 0.0.0.0; a JVM default of IPv6-only looks like "no open HTTP ports").
server.port=${PORT:8080}
server.address=0.0.0.0
# Honor X-Forwarded-* so HTTPS login cookies work behind a reverse proxy.
server.forward-headers-strategy=framework

# Override via APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD environment variables
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
