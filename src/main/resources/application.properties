# Shared. Switch DB with SPRING_PROFILES_ACTIVE (default: dev). Compose uses docker.
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Locally: PORT (default 8080) on all interfaces.
# On Render the entrypoint binds PORT and points Tomcat at loopback.
server.port=${PORT:8080}
server.address=0.0.0.0
# So HTTPS login cookies work behind a reverse proxy.
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
