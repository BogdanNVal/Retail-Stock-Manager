<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Casa de marcat</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: siteHeader}"></header>
<main class="page">
    <h1>Casa de marcat</h1>

    <div class="alert" th:if="${eroare != null}" th:text="${eroare}"></div>

    <div class="sectiune" th:if="${bon != null}">
        <p><b>Bon inregistrat! (#<span th:text="${bon.id}"></span>)</b></p>
        <table class="data-table">
            <tr>
                <th>Produs</th>
                <th>Cantitate</th>
                <th>Total fara discount</th>
                <th>Discount</th>
                <th>Total cu discount</th>
            </tr>
            <tr th:each="linie : ${bon.linii}">
                <td th:text="${linie.produs.nume}"></td>
                <td th:text="${linie.cantitate}"></td>
                <td><span th:text="${linie.totalFaraDiscount}"></span> lei</td>
                <td><span th:text="${linie.discountValoare}"></span> lei</td>
                <td><span th:text="${linie.totalCuDiscount}"></span> lei</td>
            </tr>
        </table>
        <p>
            Subtotal: <span th:text="${bon.totalFaraDiscount}"></span> lei<br/>
            Discount total: <span th:text="${bon.totalDiscount}"></span> lei<br/>
            Total cu discount: <span th:text="${bon.totalCuDiscount}"></span> lei<br/>
            TVA (<span th:text="${bon.procentTva}"></span>%): <span th:text="${bon.totalTva}"></span> lei<br/>
            <b>Total de plata (cu TVA): <span th:text="${bon.totalCuTva}"></span> lei</b>
        </p>
        <p><a th:href="@{/casa-de-marcat/{id}/bon-pdf(id=${bon.id})}">Descarca bonul (PDF)</a></p>
    </div>

    <form th:action="@{/casa-de-marcat/vinde}" method="post" id="formVanzare">
        <table class="data-table" id="tabelProduse">
            <tr>
                <th>Produs</th>
                <th>Cantitate</th>
                <th></th>
            </tr>
            <tr class="rand-produs">
                <td>
                    <select name="produsId" required>
                        <option th:each="p : ${produse}"
                                th:value="${p.id}"
                                th:text="|${p.nume} (stoc: ${p.cantitateStoc})|"></option>
                    </select>
                </td>
                <td><input type="number" name="cantitate" min="1" value="1" required/></td>
                <td><button class="btn-secondary" type="button" onclick="stergeRand(this)">Sterge</button></td>
            </tr>
        </table>

        <button class="btn-secondary" type="button" onclick="adaugaRand()">+ Adauga produs</button>
        <br/><br/>
        <button type="submit">Vinde (genereaza bon)</button>
    </form>

    <table style="display:none;">
        <tr class="rand-produs" id="randSablon">
            <td>
                <select name="produsId" required>
                    <option th:each="p : ${produse}"
                            th:value="${p.id}"
                            th:text="|${p.nume} (stoc: ${p.cantitateStoc})|"></option>
                </select>
            </td>
            <td><input type="number" name="cantitate" min="1" value="1" required/></td>
            <td><button class="btn-secondary" type="button" onclick="stergeRand(this)">Sterge</button></td>
        </tr>
    </table>

    <script>
        function adaugaRand() {
            var sablon = document.getElementById('randSablon');
            var randNou = sablon.cloneNode(true);
            randNou.removeAttribute('id');
            document.getElementById('tabelProduse').appendChild(randNou);
        }

        function stergeRand(buton) {
            var tabel = document.getElementById('tabelProduse');
            var randuri = tabel.querySelectorAll('.rand-produs');
            if (randuri.length > 1) {
                buton.closest('tr').remove();
            }
        }
    </script>
</main>
</body>
</html>
