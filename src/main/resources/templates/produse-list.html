<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Produse</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: siteHeader}"></header>
<main class="page">
    <h1>Lista produse</h1>
    <p class="alert" th:if="${eroareStergere != null}" th:text="${eroareStergere}"></p>
    <div class="toolbar">
        <a class="btn" th:href="@{/produse/nou}">+ Adauga produs</a>
    </div>
    <table class="data-table">
        <tr>
            <th>Nume</th>
            <th>Categorie</th>
            <th>Pret</th>
            <th>Stoc</th>
            <th>Cod EAN</th>
            <th></th>
        </tr>
        <tr th:each="p : ${produse}">
            <td th:text="${p.nume}"></td>
            <td th:text="${p.categorie}"></td>
            <td th:text="${p.pret}"></td>
            <td th:text="${p.cantitateStoc}"></td>
            <td th:text="${p.codEan}"></td>
            <td class="actions">
                <a th:href="@{/produse/{id}/editeaza(id=${p.id})}">Editeaza</a>
                <form th:action="@{/produse/{id}/sterge(id=${p.id})}" method="post" style="display:inline">
                    <button class="btn-danger" type="submit">Sterge</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
