# Deploy from cursor/retail-live-demo-f498, not main, until you merge.
# Paste DATABASE_URL in the Render dashboard — Render's free Postgres expires.
services:
  - type: web
    name: retail-stock-manager
    runtime: docker
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -XX:MaxRAMPercentage=65 -XX:MaxMetaspaceSize=128m -Xss512k -Djava.net.preferIPv4Stack=true"
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        sync: false
